    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      // Mirrors readPref() in assets/js/main.js — keep the storage key and the
      // dark fallback in sync across both.
      ;(function () {
        try {
          var stored = localStorage.getItem('sm.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : stored === 'system'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* private mode / storage blocked — the dark default on <html> stands */
        }
      })()
    </script>
